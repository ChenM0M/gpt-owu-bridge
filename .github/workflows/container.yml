name: Verify and publish container
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -o /tmp/gpt-owu-gate ./cmd/gpt-owu-gate
      - run: python3 scripts/m2_acceptance.py /tmp/gpt-owu-gate
  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gpt-owu-bridge:verify
          platforms: linux/amd64
      - name: Container smoke and persistence
        shell: bash
        run: |
          set -euo pipefail
          export BRIDGE_IMAGE=gpt-owu-bridge:verify
          trap 'docker compose logs; docker compose down -v' EXIT
          docker compose up -d --wait --wait-timeout 60
          curl --fail http://127.0.0.1:18089/health/ready | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["capabilities"]["mcp"] is False'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18089/sync)" = 404
          docker compose cp testdata/synthetic-share.html bridge:/data/fixture.html
          docker compose exec -T bridge /gpt-owu-gate preview --html /data/fixture.html --snapshot-out /data/persistence-check.json
          docker compose cp bridge:/data/persistence-check.json /tmp/before.json
          docker compose down
          docker compose up -d --wait --wait-timeout 60
          docker compose exec -T bridge /gpt-owu-gate healthcheck
          docker compose cp bridge:/data/persistence-check.json /tmp/after.json
          cmp /tmp/before.json /tmp/after.json
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish pinned private-tunnel runtime
        if: github.event_name != 'pull_request'
        run: |
          docker pull snowdreamtech/frpc@sha256:bfdbbc90721307e3c40771f66eae3146eddcdb187b987528f0dd3a4f9a361e30
          docker tag snowdreamtech/frpc@sha256:bfdbbc90721307e3c40771f66eae3146eddcdb187b987528f0dd3a4f9a361e30 ghcr.io/chenm0m/gpt-owu-bridge:frpc-bfdbbc907213
          docker push ghcr.io/chenm0m/gpt-owu-bridge:frpc-bfdbbc907213
      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/chenm0m/gpt-owu-bridge:sha-${{ github.sha }}
